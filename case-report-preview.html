<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Case Report — CaseGO Legal Practice Management</title>
<link href="styles.css?v=0.6.3" rel="stylesheet"/>
<style>
body{background:#eef1f4}
.preview-wrap{padding:20px}

.report-toolbar{
  max-width:900px;
  margin:0 auto 14px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap
}

.report-preview{
  max-width:900px;
  margin:0 auto;

  background:#fff;
  border:1px solid #d6dbe0;
  box-shadow:0 6px 24px rgba(15,33,50,.10)
}

@media print{
  .report-toolbar{display:none!important}

  body{
    background:#fff;
  }

  .preview-wrap{
    padding:0;
  }

  .report-preview{
    border:0;
    box-shadow:none;
  }


  h1,h2,h3{
    break-after:avoid;
    page-break-after:avoid;
  }
}
</style>
</head>
<body>
<div class="preview-wrap">
<div class="report-toolbar">
<button class="btn btn-secondary" onclick="history.back()">← Back</button>
<button class="btn btn-primary" onclick="window.print()">Print</button>
</div>
<div class="report-preview" id="caseReportPreview"></div>
</div>
<div class="toast" id="toast"></div>
<script src="desktop_bridge.js"></script>
<script src="security_guard.js"></script>
<script src="casego_records.js?v=0.6.3"></script><script src="app.js?v=0.6.3"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
  if(window.desktopHydrate) await window.desktopHydrate();
  renderCaseReportPreviewPage();
});
</script>
</body>
</html>

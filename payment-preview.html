<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Payment Receipt — CaseGO Legal Practice Management</title><link href="styles.css?v=0.6.3" rel="stylesheet"/><style>
body{background:#eef1f4}.preview-wrap{padding:20px}.receipt-toolbar{max-width:900px;margin:0 auto 14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.r-head{background:linear-gradient(135deg,#071c31,#0d355a);color:#fff;padding:30px 34px;display:flex;justify-content:space-between;gap:30px;border-bottom:5px solid #d2a44b}
.r-brand{font-family:Georgia,serif;font-size:27px;font-weight:bold}.r-contact{text-align:right;color:#f2dfae;font-size:12px;line-height:1.6}.r-body{padding:30px 34px}
.r-title{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.r-title h1{margin:0;font:700 34px Georgia,serif;color:#0b2948}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0 26px}.r-box{border:1px solid #dfe3e7;border-radius:7px;overflow:hidden}.r-box h3{margin:0;padding:9px 12px;background:#f4ead3;color:#6b4b13;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.r-box div{padding:12px;font-size:13px;line-height:1.6}
.r-amount{margin:25px 0 0 auto;width:360px;border-top:3px solid #d2a44b;padding-top:14px}.r-row{display:flex;justify-content:space-between;font-size:16px;padding:5px 0}.r-row.big{font:700 22px Georgia,serif;color:#0b2948}
.r-note{margin-top:25px;background:#f8f6f1;border-left:4px solid #d2a44b;padding:14px 16px;font-size:13px}.r-footer{margin-top:34px;background:#081f35;color:#e9d39e;text-align:center;padding:15px 20px;font-size:11px;line-height:1.55}
@media print{.receipt-toolbar{display:none!important}body{background:#fff}.preview-wrap{padding:0}.receipt-preview{border:0;box-shadow:none}}
</style></head><body><div class="preview-wrap"><div class="receipt-toolbar"><button class="btn btn-secondary" onclick="history.back()">← Back</button><button class="btn btn-secondary" onclick="saveCurrentPayment()">Save</button><button class="btn btn-secondary" onclick="emailCurrentPayment()">Email</button><button class="btn btn-primary" onclick="window.print()">Print</button></div><div class="receipt-preview" id="paymentPreview"></div></div><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="casego_config.js"></script><script src="cloud_auth.js"></script><script src="casego_records.js?v=0.6.3"></script><script src="app.js?v=0.6.3"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(window.desktopHydrate)await window.desktopHydrate();renderPaymentPreviewPage();});</script></body></html>

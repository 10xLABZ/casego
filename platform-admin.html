<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseGO Platform Administration</title><link rel="stylesheet" href="styles.css?v=0.6.9"></head>
<body data-page="platform-admin"><div class="platform-shell">
<header class="platform-topbar"><img src="casego1.png" alt="CaseGO"><div class="platform-title">PLATFORM ADMINISTRATION</div><div class="platform-spacer"></div><div class="top-user"><div class="casego-avatar">CG</div><div class="top-user-copy"><strong>Platform Administrator</strong><small>CaseGO</small></div></div></header>
<main class="platform-content"><div class="platform-heading"><div><h1>Firms</h1><p>Select a firm to enter its CaseGO portal in Platform Admin support mode.</p></div><input id="firmSearch" class="platform-search" type="search" placeholder="Search firms..." autocomplete="off"></div><div id="platformFirmGrid" class="platform-grid"></div></main>
</div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="casego_config.js"></script><script src="cloud_auth.js"></script>
<script>
(async function(){
 const identity=await window.CaseGOAuth.requireAuth(); if(!identity)return;
 window.CaseGOAuth.applyIdentityToPage();
 const grid=document.getElementById('platformFirmGrid'), search=document.getElementById('firmSearch'); let firms=[];
 async function load(){const {data,error}=await window.casegoSupabase.from('firms').select('id,name,status,email,phone,city,state,created_at').order('name');if(error){grid.innerHTML='<div class="platform-empty">Unable to load firms.</div>';console.error(error);return}firms=data||[];render();}
 function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
 function render(){const q=(search.value||'').trim().toLowerCase(), list=firms.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));grid.innerHTML=list.map(f=>`<article class="firm-tile"><div><span class="firm-status ${esc(f.status||'active')}">${esc(f.status||'active')}</span><h3>${esc(f.name)}</h3><div class="firm-meta">${esc([f.city,f.state].filter(Boolean).join(', ')||'Location not set')}</div><div class="firm-meta">${esc(f.email||f.phone||'No contact information')}</div></div><div class="firm-actions"><button class="btn btn-primary" type="button" onclick="CaseGOAuth.enterFirm('${f.id}')">ENTER FIRM</button></div></article>`).join('')||'<div class="platform-empty">No firms found.</div>';}
 search.addEventListener('input',render); await load();
})();
</script>
</body></html>

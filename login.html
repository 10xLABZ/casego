<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseGO — Sign In</title><link rel="stylesheet" href="styles.css?v=0.6.9">
<style>
body{margin:0;background:linear-gradient(135deg,#071c31,#0d355a);min-height:100vh;font-family:Arial,Helvetica,sans-serif}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}.login-card{width:410px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}.login-brand{background:#081f35;color:#fff;padding:28px 30px 23px;border-bottom:5px solid #d2a44b;text-align:center}.login-brand img{width:112px;max-height:82px;object-fit:contain;margin-bottom:10px}.login-brand h1{font:700 23px Georgia,serif;margin:4px 0}.login-brand p{margin:4px 0 0;color:#e5cf99;font-size:12px}.login-body{padding:28px 31px 30px}.login-body label{display:block;color:#33465a;font-size:12px;font-weight:700;margin:0 0 8px}.login-input{width:100%;height:46px;border:1px solid #cdd5dd;border-radius:7px;font-size:15px;padding:0 12px;outline:none;box-sizing:border-box;margin-bottom:15px}.login-input:focus{border-color:#0d4777;box-shadow:0 0 0 3px rgba(13,71,119,.10)}.login-btn{width:100%;margin-top:2px;height:46px}.login-msg{min-height:18px;margin-top:12px;text-align:center;font-size:12px;color:#a12828;line-height:1.5}.cloud-note{margin-top:16px;text-align:center;color:#78838e;font-size:11px;line-height:1.5}
</style></head>
<body><div class="login-shell"><div class="login-card"><div class="login-brand"><img src="casego1.png" alt="CaseGO"><h1>CaseGO</h1><p>Legal Practice Management</p></div>
<div class="login-body"><form id="loginForm"><label>EMAIL</label><input id="email" class="login-input" type="email" autocomplete="username" required=""><label>PASSWORD</label><input id="password" class="login-input" type="password" autocomplete="current-password" required=""><button id="loginBtn" class="btn btn-primary login-btn" type="submit">SIGN IN</button><div id="loginMsg" class="login-msg"></div></form><div class="cloud-note">Secure cloud sign-in powered by CaseGO.</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="casego_config.js"></script><script src="cloud_auth.js"></script>
<script>
(async function(){
  const msg=document.getElementById('loginMsg'), form=document.getElementById('loginForm'), btn=document.getElementById('loginBtn');
  const params=new URLSearchParams(location.search);if(params.get('reason')==='disabled')msg.textContent='This account has been disabled or access is unavailable.';
  const existing=await window.CaseGOAuth.requireAuth();if(existing)return;
  document.getElementById('email').focus();
  form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='SIGNING IN…';try{const identity=await window.CaseGOAuth.signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);location.replace(identity.profile.platform_role==='system_admin'?'platform-admin.html':'index.html')}catch(err){console.error(err);msg.textContent=err?.message||'Unable to sign in.';btn.disabled=false;btn.textContent='SIGN IN'}});
})();
</script>
</body></html>

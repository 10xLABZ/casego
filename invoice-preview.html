<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Invoice Preview — CaseGO Legal Practice Management</title>
<link href="styles.css?v=0.6.3" rel="stylesheet"/>
<style>
body{background:#eef1f4}
.preview-wrap{padding:20px}
.ip-head{background:linear-gradient(135deg,#071c31,#0d355a);color:#fff;padding:30px 34px;display:flex;justify-content:space-between;gap:30px;border-bottom:5px solid #d2a44b}
.ip-brand{font-family:Georgia,serif;font-size:27px;font-weight:bold}
.ip-contact{text-align:right;color:#f2dfae;font-size:12px;line-height:1.6}
.ip-body{padding:30px 34px}
.ip-title{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
.ip-title h1{margin:0;font:700 36px Georgia,serif;color:#0b2948}
.ip-number{text-align:right;color:#667382;font-size:13px;line-height:1.6}
.ip-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0 26px}
.ip-box{border:1px solid #dfe3e7;border-radius:7px;overflow:hidden}
.ip-box h3{margin:0;padding:9px 12px;background:#f4ead3;color:#6b4b13;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.ip-box div{padding:12px;font-size:13px;line-height:1.55}
.ip-table{width:100%;border-collapse:collapse;margin-top:18px}
.ip-table th{background:#0b2948;color:#fff;padding:11px 12px;text-align:left;font-size:12px}
.ip-table td{padding:15px 12px;border-bottom:1px solid #e0e3e6}
.ip-amount{text-align:right;font-weight:bold}
.ip-total{margin:22px 0 0 auto;width:320px;border-top:3px solid #d2a44b;padding-top:12px;display:flex;justify-content:space-between;font:700 22px Georgia,serif}
.ip-note{margin-top:28px;background:#f8f6f1;border-left:4px solid #d2a44b;padding:14px 16px;font-size:13px;line-height:1.55}
.ip-status{display:inline-block;padding:5px 10px;border-radius:999px;background:#f4ead3;color:#725115;font-weight:bold;font-size:11px}
.ip-footer{margin-top:34px;background:#081f35;color:#e9d39e;text-align:center;padding:15px 20px;font-size:11px;line-height:1.55}
@media print{
  .invoice-preview-toolbar{display:none!important}
  body{background:#fff}
  .preview-wrap{padding:0}
  .invoice-preview{border:0;box-shadow:none}
}
</style>
</head>
<body data-page="invoice-preview">
<div class="preview-wrap">
<div class="invoice-preview-toolbar">
<button class="btn btn-secondary" onclick="history.back()">← Back</button>
<button class="btn btn-secondary" onclick="saveCurrentInvoice()">Save</button>
<button class="btn btn-primary" onclick="window.print()">Print</button>
</div>
<div class="invoice-preview" id="invoicePreview"></div>
</div>
<div class="toast" id="toast"></div>
<script src="desktop_bridge.js"></script><script src="security_guard.js"></script>
<script src="casego_records.js?v=0.6.3"></script><script src="app.js?v=0.6.3"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  if(window.desktopHydrate) await window.desktopHydrate();
  renderInvoicePreviewPage();
});
</script>
</body>
</html>
